name: 'Chromatic'
# We get one Storybook per branch at https://<branch>--<appid>.chromatic.com
# https://www.chromatic.com/docs/permalinks
# Runs on every push to a branch with an open PR, plus main to keep baselines up to date.
on:
  pull_request:
    paths-ignore: &paths-ignore
      - '.buildkite/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '**/*.md'
      - 'assets/**'
      - 'cache/**'
      - 'content/terraform/**'
      - 'dash/**'
      - 'deploy/**'
      - 'docs/**'
      - 'eslint-local-rules/**'
      - 'identity/terraform/**'
      - 'infrastructure/**'
      - 'pa11y/**'
      - 'playwright/**'
      - 'prismic-model/**'
      - 'preview/**'
      - 'scripts/**'
      - 'static/**'
      - 'toggles/**'
  push:
    branches:
      - main
    paths-ignore: *paths-ignore

permissions:
  contents: read

jobs:
  chromatic-deployment:
    # Fork PRs don't get the Chromatic token, so skip them rather than fail
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # https://github.com/actions/setup-node?tab=readme-ov-file#usage
      # The node-version input is optional. If not supplied, the node version from PATH will be used.
      # However, it is recommended to always specify Node.js version and don't rely on the system one.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn
      - name: Publish to Chromatic
        uses: chromaui/action@5bcadb5104b09e360e210c54f95a7437c2d82bab # v18.13.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          workingDir: cardigan
          buildScriptName: build
          storybookBaseDir: cardigan
