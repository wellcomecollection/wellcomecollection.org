name: 'Pa11y'
on:
  deployment:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * MON-FRI'

permissions:
  id-token: write

jobs:
  pa11y_report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.deployment && github.event.deployment.environment && github.event.deployment.environment == 'prod')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pa11y 10 needs Node 22.13 or later
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.EXPERIENCE_GHA_ROLE_ARN }}
      - name: Write pa11y report and deploy it
        env:
          # Only the daily run alerts. Deploys and manual runs still write the
          # report, and without a webhook URL the script logs that it isn't
          # alerting rather than posting.
          PA11Y_SLACK_WEBHOOK_URL: ${{ github.event_name == 'schedule' && secrets.SLACK_WEBHOOK_PA11Y_URL || '' }}
        run: cd pa11y/webapp && yarn && yarn report-and-deploy
  on-failure:
    runs-on: ubuntu-latest
    # Only the daily run, like the error alert. A manual run can be started from
    # any branch, and whoever started it is already watching it.
    if: ${{ always() && github.event_name == 'schedule' && (needs.pa11y_report.result == 'failure' || needs.pa11y_report.result == 'timed_out') }}
    needs:
      - pa11y_report
    steps:
      - name: Send GitHub Action trigger data to Slack workflow
        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          payload: |
            {
              "action_name": "Pa11y action",
              "status": "${{ needs.pa11y_report.result }}",
              "link": "https://github.com/wellcomecollection/wellcomecollection.org/actions/workflows/pa11y.yml"
            }
          webhook-type: webhook-trigger
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_GA_ACTION_URL }}
