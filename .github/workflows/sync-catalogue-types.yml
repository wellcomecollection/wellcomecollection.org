name: Sync generated catalogue API types

# Regenerates the TypeScript types derived from the catalogue API's OpenAPI
# spec and opens a PR if they changed. catalogue-api sends the
# repository_dispatch event when the spec changes on its main branch; the
# weekly cron is a fallback in case a dispatch is missed.

on:
  repository_dispatch:
    types: [catalogue-spec-updated]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync-catalogue-types:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Regenerate catalogue API types
        env:
          # Empty for cron and manual runs, so the script falls back to main.
          CATALOGUE_SPEC_REF: ${{ github.event.client_payload.source_sha }}
        run: yarn generate:catalogue-types

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet content/webapp/services/wellcome/catalogue/types/generated/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="auto-sync/catalogue-types-$TIMESTAMP"
          git checkout -b $BRANCH_NAME

          git add content/webapp/services/wellcome/catalogue/types/generated/
          git commit -m "Update generated catalogue API types"
          git push origin $BRANCH_NAME

          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          This PR updates the TypeScript types generated from the catalogue API's
          OpenAPI spec (`reference/catalogue.yaml` in
          `wellcomecollection/catalogue-api`), which has changed.

          The file is regenerated by `yarn generate:catalogue-types`; do not edit
          it by hand.

          Please review and merge if the changes look correct.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "🤖 Auto-sync: Update generated catalogue API types" \
            --body-file "$RUNNER_TEMP/pr-body.md"
