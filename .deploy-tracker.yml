# yaml-language-server: $schema=https://raw.githubusercontent.com/wellcomecollection/deploy-tracker/main/schema/deploy-tracker.schema.json
version: 1

slack:
  channel: "#wc-experience-deploys"

environments:
  stage:
    checkpoints:
      - name: content
        url: https://www-stage.wellcomecollection.org/management/manifest
        paths: [content/, common/]
      - name: identity
        url: https://www-stage.wellcomecollection.org/account/management/manifest
        paths: [identity/, common/]
  prod:
    promote_from: stage
    checkpoints:
      - name: content
        url: https://wellcomecollection.org/management/manifest
        paths: [content/, common/]
      - name: identity
        url: https://wellcomecollection.org/account/management/manifest
        paths: [identity/, common/]

# Slack only while the tracker is validated; flipped on once the messages
# have been checked against real deployments for a week.
labels: false
pr_comments: false
