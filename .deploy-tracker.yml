# yaml-language-server: $schema=https://raw.githubusercontent.com/wellcomecollection/deploy-tracker/main/schema/deploy-tracker.schema.json
#
# Reports deployments of this repository to Slack. See
# https://github.com/wellcomecollection/deploy-tracker for what the tracker does.
version: 1

slack:
  channel: '#wc-experience-deploys'

# A manifest is where a service reports its running commit, joined to the host
# below. No paths needed: both environments deploy both, so neither can claim
# something it does not have.
services:
  content:
    manifest: /management/manifest
  identity:
    manifest: /account/management/manifest

environments:
  stage:
    host: https://www-stage.wellcomecollection.org
    deploys: [content, identity]
  prod:
    host: https://wellcomecollection.org
    deploys: [content, identity]
    promote_from: stage
    # Working hours waiting on stage before a nudge, since the prod gate is manual
    overdue: 2h

# deployed:<env> labels and one comment per environment, so a pull request says
# where it has got to
labels: true
pr_comments: true
