# Backplane (backplane/v1) description of this repository's software, gathered
# into https://github.com/wellcomecollection/catalog.
apiVersion: backplane/v1
kind: System
metadata:
  name: wellcomecollection-org
  description: The Wellcome Collection website
  annotations:
    github.com/project-slug: wellcomecollection/wellcomecollection.org
spec:
  owner: team:default/digital-experience
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: content
  description: The main website, a Next.js app behind Koa
  annotations:
    github.com/project-slug: wellcomecollection/wellcomecollection.org
    backstage.io/source-location: url:https://github.com/wellcomecollection/wellcomecollection.org/tree/main/content/
    backplane/dora-paths: content, common
  links:
    - title: Runbook
      url: https://github.com/wellcomecollection/wellcomecollection.org/blob/main/content/docs/runbook.md
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-experience
  system: system:wellcomecollection-org
  dependsOn:
    - component:wellcomecollection-org-common
    - ref: component:catalogue-api-search
      description: Works, images and site search pages
    - ref: component:catalogue-api-concepts
      criticality: soft
      description: Concept pages only
    - ref: component:catalogue-api-items
      criticality: soft
      description: Item availability on the work page
    - ref: component:content-api
      criticality: soft
      description: Listings and site search; Prismic serves the pages
    - ref: component:identity
      criticality: soft
      description: Sign-in state and requesting; pages render without it
    - resource:prismic
    - resource:api-wellcomecollection-org-cloudfront
  environments:
    - name: stage
      tier: staging
      github:
        task: 'deploy:weco'
      e2e: { status: e2e/stage }
      checkpoints:
        - url: https://www-stage.wellcomecollection.org/management/manifest
    - name: prod
      tier: production
      promotesFrom: stage
      # Working hours waiting on stage before a nudge, since the prod gate is manual
      overdue: 2h
      github:
        task: 'deploy:weco'
      e2e: { status: e2e/prod }
      checkpoints:
        - url: https://wellcomecollection.org/management/manifest
  slos:
    # Agreed 2026-11-13; see docs adr/service_levels.md.
    - name: availability
      description: Requests to the content app not answered with a 5xx
      objective: 99.5
      window: 28d
      sli:
        source: cloudwatch
        good: 'RequestCount - HTTPCode_Target_5XX_Count'
        total: 'RequestCount'
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: identity
  description: Account pages under /account, a Next.js app behind Koa
  annotations:
    github.com/project-slug: wellcomecollection/wellcomecollection.org
    backstage.io/source-location: url:https://github.com/wellcomecollection/wellcomecollection.org/tree/main/identity/
    backplane/dora-paths: identity, common
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-experience
  system: system:wellcomecollection-org
  dependsOn:
    - component:wellcomecollection-org-common
    - ref: component:identity-api
      description: Every /account/api/users/me call
    - resource:auth0
    - ref: resource:prismic
      criticality: soft
      description: Server-data globals, cached with a default
  environments:
    - name: stage
      tier: staging
      github:
        task: 'deploy:weco'
      e2e: { status: e2e/stage }
      checkpoints:
        - url: https://www-stage.wellcomecollection.org/account/management/manifest
    - name: prod
      tier: production
      promotesFrom: stage
      # Working hours waiting on stage before a nudge, since the prod gate is manual
      overdue: 2h
      github:
        task: 'deploy:weco'
      e2e: { status: e2e/prod }
      checkpoints:
        - url: https://wellcomecollection.org/account/management/manifest
  slos:
    # Agreed 2026-11-13; see docs adr/service_levels.md.
    - name: availability
      description: Requests to the account pages not answered with a 5xx
      objective: 99.95
      window: 28d
      sli:
        source: cloudwatch
        good: 'RequestCount - HTTPCode_Target_5XX_Count'
        total: 'RequestCount'
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: wellcomecollection-org-common
  description: Code shared by the content and identity apps
  annotations:
    github.com/project-slug: wellcomecollection/wellcomecollection.org
    backstage.io/source-location: url:https://github.com/wellcomecollection/wellcomecollection.org/tree/main/common/
spec:
  type: library
  lifecycle: production
  owner: team:default/digital-experience
  system: system:wellcomecollection-org
